<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>The Humanity Roadmap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js"></script>
  <script src="roadmap-gen.js"></script>
  <script>
    window.claude = {
      complete: async (prompt) => {
        const response = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            // Add your Anthropic API key here locally. Never commit the real key.
            "x-api-key": "YOUR_API_KEY_HERE",
            "anthropic-version": "2023-06-01",
            "anthropic-dangerous-direct-browser-access": "true"
          },
          body: JSON.stringify({
            model: "claude-sonnet-4-20250514",
            max_tokens: 1000,
            messages: [{ role: "user", content: prompt }]
          })
        });
        if (!response.ok) {
          const errorBody = await response.text();
          throw new Error(`Anthropic API error ${response.status}: ${errorBody}`);
        }
        const data = await response.json();
        return data.content[0].text;
      }
    };

    // Quick connectivity check so you can validate API wiring in DevTools.
    window.addEventListener("load", async () => {
      try {
        const result = await window.claude.complete("Reply with exactly: CONNECTED");
        console.log("[Claude API Test] Success:", result);
      } catch (err) {
        console.error("[Claude API Test] Failed:", err);
      }
    });
  </script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="screens-intro.jsx"></script>
  <script type="text/babel" src="question-controls.jsx"></script>
  <script type="text/babel" src="questionnaire.jsx"></script>
  <script type="text/babel" src="transition.jsx"></script>
  <script type="text/babel" src="roadmap-screen.jsx"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "transitionDurationMs": 9000
    }/*EDITMODE-END*/;

    const SCREENS = [
      { id: "welcome",       label: "01 Welcome" },
      { id: "framing",       label: "02 Framing" },
      { id: "questionnaire", label: "03 Questionnaire" },
      { id: "transition",    label: "04 Transition" },
      { id: "roadmap",       label: "05 Roadmap" },
    ];

    // Synthetic answers for jumping to roadmap directly
    const SAMPLE_ANSWERS = {
      alive: "joy",
      atrophied: "soul",
      time_now: { work: 42, relationships: 18, "time alone with yourself": 6, play: 8, community: 6, creativity: 10, rest: 10 },
      time_want: { work: 28, relationships: 20, "time alone with yourself": 12, play: 10, community: 10, creativity: 12, rest: 8 },
      present: "Walking with my daughter on Saturday morning, no phone.",
      wise_one: "My grandmother — she never rushes a sentence.",
      time_disappears: "Cooking for friends.",
      deepen: "My partner.",
      survived: "A year I don't yet have words for.",
      year_from_now: "I write in the mornings before anything asks for me.",
      focus: ["soul", "wisdom", "community"],
      afraid: "Becoming someone who only reacts.",
      discretionary: "2 – 5 hours",
      most_yourself: "Early mornings",
      in_the_way: "I commit and then over-fill the calendar within a week.",
    };

    function App() {
      const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [screen, setScreen] = useState("welcome");
      const [answers, setAnswers] = useState({});
      const [roadmap, setRoadmap] = useState(null);
      const [generating, setGenerating] = useState(false);
      const [transitionStartedAt, setTransitionStartedAt] = useState(null);

      const setAnswer = (id, val) => setAnswers((a) => ({ ...a, [id]: val }));

      // When entering transition, kick off generation in parallel
      useEffect(() => {
        if (screen === "transition" && !generating && !roadmap) {
          setGenerating(true);
          setTransitionStartedAt(Date.now());
          window.generateRoadmap(answers).then((r) => {
            setRoadmap(r);
            setGenerating(false);
          });
        }
      }, [screen]);

      const onTransitionDone = () => {
        // Wait for roadmap if not yet ready (rarely needed since transition is ~9s)
        if (roadmap) setScreen("roadmap");
        else {
          const wait = setInterval(() => {
            if (roadmap) {
              clearInterval(wait);
              setScreen("roadmap");
            }
          }, 200);
        }
      };

      const restart = () => {
        setAnswers({});
        setRoadmap(null);
        setScreen("welcome");
      };

      // Allow tweaks panel to jump to a screen
      const jumpTo = (id) => {
        if (id === "roadmap") {
          // Use sample answers + demo roadmap for review
          setAnswers(SAMPLE_ANSWERS);
          setRoadmap({ source: "demo", ...window.buildDemoRoadmap(SAMPLE_ANSWERS) });
          setScreen("roadmap");
        } else if (id === "transition") {
          setAnswers(SAMPLE_ANSWERS);
          setRoadmap(null);
          setScreen("transition");
        } else {
          setScreen(id);
        }
      };

      return (
        <>
          {screen === "welcome" && (
            <WelcomeScreen onBegin={() => setScreen("framing")} />
          )}
          {screen === "framing" && (
            <FramingScreen onContinue={() => setScreen("questionnaire")} />
          )}
          {screen === "questionnaire" && (
            <QuestionnaireScreen
              answers={answers}
              setAnswer={setAnswer}
              onComplete={() => setScreen("transition")}
            />
          )}
          {screen === "transition" && (
            <TransitionScreen onComplete={onTransitionDone} durationMs={tweaks.transitionDurationMs} />
          )}
          {screen === "roadmap" && roadmap && (
            <RoadmapScreen
              answers={answers}
              roadmap={roadmap}
              source={roadmap.source}
              onRestart={restart}
            />
          )}

          <TweaksPanel title="Tweaks">
            <TweakSection label="Jump to screen">
              <p style={{ fontSize: 11, color: "#8A7B62", margin: "0 0 8px", lineHeight: 1.5 }}>
                For reviewing — sample answers used as needed.
              </p>
              <div style={{ display: "grid", gap: 6 }}>
                {SCREENS.map((s) => (
                  <button key={s.id}
                    onClick={() => jumpTo(s.id)}
                    style={{
                      textAlign: "left",
                      padding: "10px 12px",
                      border: "1px solid " + (screen === s.id ? "#2C2416" : "#E5DCC9"),
                      background: screen === s.id ? "#2C2416" : "transparent",
                      color: screen === s.id ? "#FAF6F0" : "#2C2416",
                      borderRadius: 4,
                      fontFamily: "Lora, Georgia, serif",
                      fontSize: 13,
                      letterSpacing: "0.04em",
                      cursor: "pointer",
                    }}>
                    {s.label}
                  </button>
                ))}
              </div>
            </TweakSection>
            <TweakSection label="Transition moment" />
            <TweakSlider label="Duration"
              min={6} max={20} step={1} unit="s"
              value={Math.round(tweaks.transitionDurationMs / 1000)}
              onChange={(v) => setTweak("transitionDurationMs", v * 1000)} />
            <p style={{ fontSize: 11, color: "#8A7B62", margin: "4px 0 0", lineHeight: 1.5, fontStyle: "italic" }}>
              Brief asks 10–15s. Default is 9. Don't go shorter than 6.
            </p>
          </TweaksPanel>
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>

  <style>
    @media print {
      body::before, body::after, .beam, .progress-line, .tweaks-panel, .btn, .btn-ghost { display: none !important; }
      body { background: #FAF6F0 !important; }
      .stage { padding-top: 24px !important; }
    }
  </style>
</body>
</html>
