<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>The Awe Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- ===================================================================
       PRESERVED API WIRING — do not restructure.
       IMPORTANT: the x-api-key below must NEVER be committed publicly.
       This file is kept out of commits via:  git update-index --assume-unchanged index.html
       =================================================================== -->
  <script>
    window.claude = {
      complete: async (prompt) => {
        const response = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            // Add your Anthropic API key here locally. Never commit the real key.
            "x-api-key": "YOUR_API_KEY_HERE",
            "anthropic-version": "2023-06-01",
            "anthropic-dangerous-direct-browser-access": "true"
          },
          body: JSON.stringify({
            model: "claude-sonnet-4-20250514",
            max_tokens: 1000,
            messages: [{ role: "user", content: prompt }]
          })
        });
        if (!response.ok) {
          const errorBody = await response.text();
          throw new Error(`Anthropic API error ${response.status}: ${errorBody}`);
        }
        const data = await response.json();
        return data.content[0].text;
      }
    };

    // Quick connectivity check so you can validate API wiring in DevTools.
    window.addEventListener("load", async () => {
      try {
        const result = await window.claude.complete("Reply with exactly: CONNECTED");
        console.log("[Claude API Test] Success:", result);
      } catch (err) {
        console.error("[Claude API Test] Failed:", err);
      }
    });
  </script>

  <!-- Plain data + AI helpers (globals on window). -->
  <script src="data.js"></script>
  <script src="ai.js"></script>

  <!-- Components (Babel). Phases and the chart load before app.jsx, which mounts. -->
  <script type="text/babel" src="wheel-chart.jsx"></script>
  <script type="text/babel" src="phase0-primer.jsx"></script>
  <script type="text/babel" src="phase1-identity.jsx"></script>
  <script type="text/babel" src="phase2-wheel.jsx"></script>
  <script type="text/babel" src="phase3-time.jsx"></script>
  <script type="text/babel" src="phase4-reframe.jsx"></script>
  <script type="text/babel" src="phase5-roadmap.jsx"></script>
  <script type="text/babel" src="phase6-artifact.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
